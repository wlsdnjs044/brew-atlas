<title>BREW ATLAS — 한 잔의 좌표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --slate:#4A5568;          /* 베이스 1 — 구조·타이포 */
  --clay:#C9847A;           /* 베이스 2 — 기본 강조 */
  --accent:var(--clay);     /* 시트별로 교체됨 */

  --bg:#F3F2F0; --surface:#FFFFFF; --surface2:#EBEAE7;
  --line:#DCDBD7; --line-soft:#E7E6E3; --track:#E4E3DF;
  --fg:#333B49; --dim:#77808F; --head:#2C3444; --num:#414A5A;
  --ink-mix:#232A35;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'IBM Plex Sans KR',system-ui,sans-serif;
}
*{box-sizing:border-box;
  --accent-ink:color-mix(in srgb, var(--accent) 68%, var(--ink-mix));
  --accent-wash:color-mix(in srgb, var(--accent) 13%, transparent)}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-weight:400;font-size:14px;line-height:1.62;-webkit-font-smoothing:antialiased}
button{font-family:var(--sans);cursor:pointer}


/* ---------- 상단 바 ---------- */
.topbar{background:var(--slate);position:sticky;top:0;z-index:30}
.topbar-in{max-width:1080px;margin:0 auto;padding:0 34px;height:58px;display:flex;align-items:center;gap:14px}
.mark{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:-.015em;color:#F0F2F5;
  background:none;border:0;font-family:var(--sans);padding:0}
.mark .bead{width:20px;height:20px;border-radius:50%;background:var(--accent);flex:none;transition:background-color .25s;
  box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 26%, transparent)}
.addbtn{margin-left:auto;background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.24);color:#EDEFF3;
  font-size:13px;padding:8px 15px;border-radius:8px;transition:.15s}
.addbtn:hover{background:#fff;color:var(--slate);border-color:#fff}
.addbtn.solid{background:var(--accent-ink);border:0;color:#fff;font-weight:600;margin-left:0;padding:10px 20px}
.addbtn.solid:hover{filter:brightness(1.08);color:#fff}
.linkbtn{background:none;border:0;color:var(--dim);font-family:var(--mono);font-size:10.5px;text-decoration:underline;padding:0}
.linkbtn:hover{color:var(--slate)}
.pagefoot{border-top:1px solid var(--line);margin-top:10px;padding:20px 0 46px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pagefoot p{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin:0}

/* ---------- 본문 ---------- */
.main{padding:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 34px}
.hero{padding:52px 0 8px;position:relative}
.hero::before{content:"";position:absolute;left:-120px;top:-120px;width:440px;height:300px;pointer-events:none;
  background:radial-gradient(closest-side, var(--accent-wash), transparent);transition:background .35s}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.hero h1{font-size:clamp(26px,3.6vw,37px);font-weight:600;letter-spacing:-.032em;line-height:1.2;margin:12px 0 0;color:var(--head)}
.hero h1 mark{background:none;color:var(--accent-ink);transition:color .25s}
.hero p{color:var(--dim);max-width:52ch;margin:12px 0 0;font-size:14px;font-weight:300}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:30px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:15px 17px;position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);transition:background-color .25s}
.stat .k{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
.stat .v{font-size:29px;font-weight:600;letter-spacing:-.035em;margin-top:3px;color:var(--head)}
.stat .v small{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--dim);margin-left:4px;letter-spacing:0}

.panel{display:none;padding:26px 0 80px}
.panel.on{display:block}
.sec{margin-bottom:40px}
.sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-head h2{font-size:19px;font-weight:600;margin:0;letter-spacing:-.025em;color:var(--head)}
.sec-head .note{font-size:12.5px;color:var(--dim);font-weight:300}
.rule{height:0;margin:14px 0 16px}

/* ---------- 차트 ---------- */
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:18px 16px 10px}
.chart-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px;padding:0 4px}
.seg{display:flex;background:var(--surface2);border-radius:9px;padding:3px;gap:3px}
.seg button{background:none;border:0;color:var(--dim);font-size:12.5px;padding:6px 13px;border-radius:6px;transition:.18s}
.seg button[aria-pressed="true"]{background:var(--accent-ink);color:#fff;font-weight:600}
.legend{margin-left:auto;display:flex;gap:14px;font-family:var(--mono);font-size:10.5px;color:var(--dim);align-items:center}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent);margin-right:5px;vertical-align:-1px}
.legend i.hollow{background:none;border:2px solid var(--accent)}
.legend i.dash{background:none;border:1px dashed var(--slate)}
svg{display:block;width:100%;height:auto;overflow:visible}
.grid-l{stroke:var(--line-soft)}
.axis-l{stroke:var(--line)}
.axis-t{font-family:var(--mono);font-size:9.5px;fill:var(--dim)}
.axis-title{font-family:var(--mono);font-size:10px;fill:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.flag-ring{stroke:var(--slate);stroke-width:1.2;stroke-dasharray:3 3}
.dot{cursor:pointer;transition:.15s}
.dot:hover{filter:saturate(1.35) drop-shadow(0 2px 6px rgba(74,85,104,.35))}
.dot-lab{font-family:var(--mono);font-size:9.5px;fill:var(--dim);pointer-events:none}
.nodata{color:var(--dim);padding:24px 6px;font-size:13px}

/* ---------- 테이블 ---------- */
.tblwrap{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:4px 12px;overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
.tbl th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:500;padding:14px 10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:13px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tr.row{cursor:pointer;transition:.12s}
.tbl tr.row:hover{background:var(--accent-wash)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--num)}
.num.em{color:var(--accent-ink);font-weight:600}
.bean-n{display:block;font-weight:600;font-size:13.5px;line-height:1.35;color:var(--head)}
.bean-s{font-family:var(--mono);font-size:11px;color:var(--dim)}
.stars{color:var(--accent-ink);font-size:12px;letter-spacing:1px}
.stars b{color:var(--line)}
.chip{display:inline-block;font-family:var(--mono);font-size:10px;padding:3px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.chip.flag{background:var(--slate);border-color:var(--slate);color:#fff}
.chip.intent,.chip.new{background:var(--accent-wash);border-color:color-mix(in srgb, var(--accent) 45%, transparent);color:var(--accent-ink)}
.det{background:var(--surface2)}
.det-in{padding:8px 12px 20px;display:grid;grid-template-columns:1fr 1fr;gap:26px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-content:start;font-size:12.5px}
.kv dt{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.09em;text-transform:uppercase;padding-top:2px}
.kv dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--num)}
.taste{display:grid;gap:10px;align-content:start}
.taste-row{display:grid;grid-template-columns:44px 1fr 24px;align-items:center;gap:10px;font-size:11.5px;color:var(--dim)}
.bar{height:6px;background:var(--track);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:background-color .25s}
.taste-row .num{text-align:right;font-size:11px;color:var(--dim)}
.memo{grid-column:1/-1;background:var(--surface);border:1px solid var(--line-soft);border-left:3px solid var(--accent);border-radius:9px;padding:12px 14px;color:#4E5768;font-size:13px;font-weight:300;transition:border-color .25s}

/* ---------- 원두 ---------- */
.beans{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:12px}
.bean{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:18px;display:flex;flex-direction:column;gap:11px;transition:.15s}
.bean:hover{border-color:color-mix(in srgb, var(--accent) 55%, transparent);box-shadow:0 4px 16px rgba(74,85,104,.07)}
.bean .roaster{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent-ink)}
.bean h3{font-size:14.5px;font-weight:600;margin:5px 0 0;line-height:1.35;color:var(--head)}
.bean .meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-family:var(--mono);font-size:11px;color:var(--num)}
.bean .meta b{color:var(--dim);font-weight:400}
.bnote{font-size:12px;color:var(--dim);font-weight:300}
.age{color:var(--accent-ink);font-weight:500}
.rl{display:flex;gap:3px;align-items:center;margin-top:auto;padding-top:12px;border-top:1px solid var(--line-soft)}
.rl i{height:5px;flex:1;background:var(--track);border-radius:99px}
.rl i.on{background:var(--accent)}
.rl span{font-family:var(--mono);font-size:10px;color:var(--dim);margin-left:7px;white-space:nowrap}

/* ---------- 빈 상태 / 커핑 ---------- */
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:52px 26px;text-align:center}
.empty h3{font-size:18px;font-weight:600;margin:0 0 9px;letter-spacing:-.02em;color:var(--head)}
.empty p{color:var(--dim);max-width:44ch;margin:0 auto 20px;font-size:13.5px;font-weight:300}
.cup .det-in{padding:18px 8px}
.cup-t{font-size:19px;font-weight:600;margin:8px 0 3px;letter-spacing:-.025em;color:var(--head)}
.bigscore{font-size:50px;font-weight:600;color:var(--accent-ink);margin:16px 0 0;letter-spacing:-.045em;line-height:1;transition:color .25s}

/* ---------- 장비 ---------- */
.gear-grp{margin-bottom:28px}
.gear-grp>h3{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink);margin:0 0 12px;font-weight:500}
.gear{display:grid;grid-template-columns:repeat(auto-fill,minmax(264px,1fr));gap:12px}
.gear-i{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:15px 16px}
.g-k{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
.g-n{font-size:13.5px;font-weight:600;margin:4px 0 3px;line-height:1.35;color:var(--head)}
.g-m{font-size:12px;color:var(--dim);line-height:1.5;font-weight:300}


/* ---------- 메인: 시트 카드 ---------- */
.lastline{margin-top:18px;font-size:12.5px;color:var(--dim);font-family:var(--mono)}
.lastline b{color:var(--num);font-weight:500}
.sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:13px}
.sheet{position:relative;display:grid;gap:5px;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:15px;padding:20px 19px 17px;cursor:pointer;transition:.18s;overflow:hidden;font-family:var(--sans)}
.sheet::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.sheet:hover{border-color:color-mix(in srgb, var(--accent) 60%, transparent);transform:translateY(-2px);
  box-shadow:0 8px 22px rgba(74,85,104,.10)}
.sheet .sdot{position:absolute;right:18px;top:18px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.sheet .scount{font-size:30px;font-weight:600;letter-spacing:-.04em;color:var(--accent-ink);line-height:1.05}
.sheet .scount em{font-style:normal;font-family:var(--mono);font-size:11px;font-weight:400;color:var(--dim);margin-left:4px;letter-spacing:0}
.sheet .sname{font-size:15px;font-weight:600;color:var(--head);margin-top:3px}
.sheet .sdesc{font-size:12.5px;color:var(--dim);font-weight:300;line-height:1.5}
.sheet .sgo{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);margin-top:9px;opacity:0;transform:translateX(-4px);transition:.18s}
.sheet:hover .sgo{opacity:1;transform:none}
.sheet.all{background:linear-gradient(180deg,var(--surface),#F4F4F3)}


.sheet .snum{position:absolute;left:19px;top:19px;font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.08em}
.sheet{padding-top:42px}
.sheet.wide{margin-top:13px;padding-top:22px;grid-template-columns:1fr auto;align-items:center;
  background:linear-gradient(180deg,var(--surface),#F3F3F2)}
.sheet.wide .sname{font-size:15px}
.sheet.wide .sgo{opacity:1;transform:none;margin-top:0}

/* ---------- 시트 페이지 헤더 ---------- */
.pagehead{padding:38px 0 6px;position:relative}
.pagehead::before{content:"";position:absolute;left:-120px;top:-110px;width:420px;height:280px;pointer-events:none;
  background:radial-gradient(closest-side, var(--accent-wash), transparent);transition:background .35s}
.backlink{background:none;border:0;font-family:var(--mono);font-size:11px;color:var(--dim);padding:0 0 12px;text-decoration:none}
.backlink:hover{color:var(--accent-ink)}
.pagehead .eyebrow{display:flex;align-items:center;gap:7px}
.pagehead .hdot{width:8px;height:8px;border-radius:50%;background:var(--accent);transition:background-color .25s}
.pagehead h1{font-size:clamp(25px,3.4vw,34px);font-weight:600;letter-spacing:-.032em;margin:10px 0 0;color:var(--head)}
.pagehead p{color:var(--dim);max-width:52ch;margin:9px 0 0;font-size:13.5px;font-weight:300}
.charttitle{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.gap{height:14px}

/* ---------- 전체 보기 ---------- */
.jump{display:flex;flex-wrap:wrap;gap:7px;margin-top:20px}
.jump button{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--num);font-family:var(--sans);
  background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 13px;transition:.15s}
.jump button i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.jump button:hover{border-color:color-mix(in srgb, var(--accent) 60%, transparent);color:var(--accent-ink)}
.ovsec{padding:34px 0 6px;scroll-margin-top:24px}
.ovsec+.ovsec{border-top:1px solid var(--line)}
.ovhead{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:18px}
.ovnum{font-family:var(--mono);font-size:11px;color:#fff;background:var(--accent);padding:3px 8px;border-radius:5px;letter-spacing:.06em}
.ovhead h2{font-size:19px;font-weight:600;margin:0;letter-spacing:-.025em;color:var(--head)}
.ovcount{font-family:var(--mono);font-size:11px;color:var(--dim)}
.ovopen{margin-left:auto;background:none;border:1px solid var(--line);border-radius:999px;font-family:var(--mono);
  font-size:11px;color:var(--dim);padding:5px 13px;transition:.15s}
.ovopen:hover{border-color:var(--accent);color:var(--accent-ink)}

/* ---------- 모달 ---------- */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(52,60,74,.42);backdrop-filter:blur(3px);z-index:60;display:none;overflow-y:auto;padding:22px}
.scrim.on{display:block}
.modal{max-width:640px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 18px 50px rgba(44,52,68,.18)}
.modal-h{display:flex;align-items:center;gap:12px;padding:17px 20px;border-bottom:1px solid var(--line)}
.modal-h h2{font-size:16px;font-weight:600;margin:0;letter-spacing:-.02em;color:var(--head)}
.x{margin-left:auto;background:none;border:0;color:var(--dim);font-size:18px;padding:4px 8px;border-radius:6px}
.x:hover{color:var(--fg);background:var(--surface2)}
.modal-b{padding:18px 20px 22px}
.type-seg{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.type-seg button{flex:1;min-width:92px;background:var(--surface2);border:1px solid var(--line);border-radius:9px;color:var(--dim);font-size:12.5px;padding:9px}
.type-seg button[aria-pressed="true"]{background:var(--slate);color:#fff;border-color:var(--slate);font-weight:600}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.f{display:flex;flex-direction:column;gap:5px}
.f.wide{grid-column:1/-1}
.f label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.f input,.f select,.f textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;color:var(--fg);font-family:var(--mono);font-size:13px;padding:10px;width:100%}
.f textarea{font-family:var(--sans);min-height:62px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:0;background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
.hint{font-family:var(--mono);font-size:10px;color:var(--dim)}
.modal-f{display:flex;gap:10px;align-items:center;padding:15px 20px;border-top:1px solid var(--line);background:var(--surface2)}
.save{background:var(--slate);color:#fff;border:0;border-radius:8px;font-weight:600;font-size:13px;padding:10px 22px}
.save:hover{filter:brightness(1.14)}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;color:var(--dim);font-size:13px;padding:10px 18px}
.ghost:hover{color:var(--fg);border-color:var(--dim)}
.err{color:#B4483A;font-size:12px;margin-left:auto}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,12px);background:var(--slate);color:#fff;font-size:13px;font-weight:500;padding:11px 20px;border-radius:999px;z-index:80;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 8px 26px rgba(44,52,68,.24)}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap;z-index:40}
  .mark{padding:0}
  .tabs{flex-direction:row;overflow-x:auto;flex:1;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap;padding:7px 11px;width:auto}
  
  .addbtn{width:auto;padding:8px 14px}
  .side .foot{display:none}
  .stats{grid-template-columns:1fr 1fr}
  .det-in,.fgrid{grid-template-columns:1fr}
  .hide-s{display:none}
  .wrap{padding:0 20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}

/* ================= 메인 화면 v2 ================= */
html[data-theme="dark"]{
  --bg:#191D23; --surface:#222831; --surface2:#2A313B;
  --line:#343C47; --line-soft:#2C333D; --track:#333A44;
  --fg:#DDE3EA; --dim:#8C96A4; --head:#F1F4F8; --num:#C6CED9;
  --ink-mix:#F2F6FA; --slate:#39414F;
}
html[data-theme="dark"] .topbar{background:#20262E;border-bottom:1px solid var(--line)}
html[data-theme="dark"] .sheet.wide{background:linear-gradient(180deg,#252C35,#212831)}
html[data-theme="dark"] .winbox{box-shadow:0 24px 70px rgba(0,0,0,.5)}
html[data-theme="dark"] .chip.flag{background:#5A6474;border-color:#5A6474}

body{position:relative}

/* 상단바 */
.topbar{background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{height:60px;justify-content:center;position:relative}
.mark{color:var(--head);gap:9px}
.mark .bead{width:22px;height:22px}
.topright{position:absolute;right:34px;display:flex;gap:8px;align-items:center}
.pillbtn{background:var(--surface);border:1px solid var(--line);border-radius:999px;color:var(--fg);
  font-size:12.5px;padding:7px 14px;display:flex;align-items:center;gap:6px;transition:.15s;font-family:var(--sans)}
.pillbtn:hover{border-color:var(--accent);color:var(--accent-ink)}
.addbtn{margin-left:0}

/* 히어로 — 중앙 정렬 */
.hero{padding:60px 0 6px;text-align:center}
.hero::before{display:none}
.badge{display:inline-block;font-size:12px;font-weight:500;color:var(--accent-ink);
  background:var(--accent-wash);border:1px solid color-mix(in srgb, var(--accent) 30%, transparent);
  border-radius:999px;padding:6px 16px;margin-bottom:22px}
.hero h1{font-size:clamp(30px,5vw,46px);font-weight:700;letter-spacing:-.04em;line-height:1.14;margin:0;color:var(--head)}
.hero h1 mark{background:none}
.hero h1 .c1{color:#C9847A}.hero h1 .c2{color:#6E8FA8}
.hero p{max-width:62ch;margin:18px auto 0;font-size:14.5px;color:var(--dim);font-weight:300;line-height:1.75}
.bignums{display:flex;justify-content:center;gap:52px;margin:34px 0 0;flex-wrap:wrap}
.bignum{text-align:center}
.bignum b{display:block;font-size:34px;font-weight:700;letter-spacing:-.045em;line-height:1.1}
.bignum span{display:block;font-size:11.5px;color:var(--dim);margin-top:5px}
.bignum:nth-child(1) b{color:#C9847A}
.bignum:nth-child(2) b{color:#7D9A76}
.bignum:nth-child(3) b{color:#A98A5C}
.lastline{margin-top:24px;font-size:12.5px;color:var(--dim);font-family:var(--mono);text-align:center}
.lastline b{color:var(--num);font-weight:500}

/* 시트 카드 v2 */
.sec-head{justify-content:center;text-align:center}
.sec-head h2{font-size:17px}
.rule{display:none}
.sheets{display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:16px;margin-top:22px}
.sheet{position:relative;display:grid;gap:0;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:26px 24px 22px;cursor:pointer;transition:.2s;overflow:hidden;font-family:var(--sans)}
.sheet::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;width:auto;
  background:linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 45%, var(--slate)))}
.sheet:hover{transform:translateY(-3px);border-color:color-mix(in srgb, var(--accent) 50%, transparent);
  box-shadow:0 12px 30px rgba(74,85,104,.13)}
.sheet .sdot{display:none}
.sheet .snum{position:absolute;right:20px;top:20px;font-size:40px;font-weight:700;letter-spacing:-.05em;
  color:color-mix(in srgb, var(--accent) 22%, transparent);line-height:1}
.sheet .sicon{font-size:19px;line-height:1;margin-bottom:9px}
.sheet .sname{font-size:16px;font-weight:700;color:var(--head);letter-spacing:-.02em}
.sheet .sdesc{font-size:12.5px;color:var(--dim);font-weight:300;line-height:1.62;margin-top:8px;min-height:3.2em}
.sheet .schips{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.sheet .schips span{font-size:11px;font-weight:500;color:var(--accent-ink);background:var(--accent-wash);
  border:1px solid color-mix(in srgb, var(--accent) 26%, transparent);border-radius:7px;padding:4px 9px}
.sheet .sgo{font-family:var(--sans);font-size:12.5px;font-weight:600;letter-spacing:0;text-transform:none;
  color:var(--accent-ink);margin-top:16px;opacity:1;transform:none}
.sheet:hover .sgo{transform:translateX(3px)}
.sheet .scount{display:none}
.sheet.wide{grid-template-columns:1fr auto;align-items:center;padding:22px 24px;margin-top:16px;
  background:linear-gradient(180deg,var(--surface),var(--surface2))}
.sheet.wide .sdesc{min-height:0;margin-top:5px}
.sheet.wide .sgo{margin-top:0}
.homefoot{text-align:center;padding:44px 0 10px}
.homefoot p{font-size:11.5px;color:var(--dim);margin:0 0 5px;line-height:1.7}
.homefoot .pal{font-family:var(--mono);font-size:10.5px}
@media (max-width:760px){
  .topright{right:16px}
  .bignums{gap:30px}
  .topbar-in{padding:0 16px}
}

/* ================= 페이지 전환 ================= */
#page-home{display:none}
#page-home.on{display:block}
#page-sheets{display:none;padding:26px 0 70px}
#page-sheets.on{display:grid;grid-template-columns:216px 1fr;gap:30px;align-items:start}

/* 좌측 시트 내비 */
.snav{position:sticky;top:78px;display:flex;flex-direction:column;gap:3px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 10px}
.snav .navtitle{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);padding:4px 9px 8px}
.snav button{--c:var(--slate);display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:none;border:0;border-radius:9px;color:var(--fg);font-family:var(--sans);font-size:13px;
  padding:9px 10px;transition:.15s}
.snav button i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;opacity:.5;transition:.15s}
.snav button em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-left:auto}
.snav button:hover{background:var(--surface2)}
.snav button:hover i{opacity:1}
.snav button[aria-current="true"]{background:color-mix(in srgb, var(--c) 14%, transparent);font-weight:600}
.snav button[aria-current="true"] i{opacity:1;box-shadow:0 0 0 3px color-mix(in srgb, var(--c) 22%, transparent)}
.snav .navback{border-top:1px solid var(--line-soft);margin-top:8px;padding-top:12px;border-radius:0;
  font-family:var(--mono);font-size:11px;color:var(--dim)}
.snav .navback i{display:none}

/* 시트 페이지 본문 */
.sheadwrap{margin-bottom:20px}
.sheadwrap .eyebrow{display:flex;align-items:center;gap:7px}
.sheadwrap .hdot{width:8px;height:8px;border-radius:50%;background:var(--accent);transition:background-color .25s}
.sheadwrap h1{font-size:clamp(23px,3vw,30px);font-weight:700;letter-spacing:-.035em;margin:10px 0 0;color:var(--head)}
.sheadwrap p{color:var(--dim);max-width:60ch;margin:8px 0 0;font-size:13.5px;font-weight:300}
.exall{background:none;border:1px solid var(--line);border-radius:999px;font-family:var(--mono);font-size:11px;
  color:var(--dim);padding:5px 13px;margin-top:14px;transition:.15s}
.exall:hover{border-color:var(--accent);color:var(--accent-ink)}

/* 드롭다운(아코디언) */
.acc{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:12px;overflow:hidden;scroll-margin-top:80px}
.acc-head{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;
  padding:16px 18px;font-family:var(--sans);text-align:left;transition:.15s;position:relative}
.acc-head::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);opacity:.85}
.acc-head:hover{background:var(--accent-wash)}
.acc-head .aicon{font-size:16px;line-height:1}
.acc-head .aname{font-size:15px;font-weight:600;color:var(--head);letter-spacing:-.02em}
.acc-head .acount{font-family:var(--mono);font-size:11px;color:var(--accent-ink);
  background:var(--accent-wash);border-radius:999px;padding:3px 9px}
.acc-head .adesc{font-size:12px;color:var(--dim);font-weight:300;margin-left:4px}
.acc-head .chev{margin-left:auto;color:var(--dim);font-size:11px;transition:transform .2s}
.acc.open .chev{transform:rotate(180deg)}
.acc-body{display:none;padding:4px 18px 22px;border-top:1px solid var(--line-soft)}
.acc.open .acc-body{display:block}
.acc.open .acc-head{background:var(--accent-wash)}

@media (max-width:860px){
  #page-sheets.on{grid-template-columns:1fr;gap:16px}
  .snav{position:static;flex-direction:row;overflow-x:auto;scrollbar-width:none;padding:9px}
  .snav::-webkit-scrollbar{display:none}
  .snav .navtitle{display:none}
  .snav button{width:auto;white-space:nowrap}
  .snav button em{display:none}
  .snav .navback{border-top:0;border-left:1px solid var(--line-soft);margin-top:0;padding-top:9px;margin-left:4px;padding-left:12px}
  .acc-head .adesc{display:none}
  .acc-body{padding:4px 12px 18px}
}

/* ===== 메인 카드 배치 v3: 전체 보기 상단 · 5시트 한 줄 ===== */
.sheets{grid-template-columns:repeat(5,1fr);gap:12px;margin-top:0}
.sheet{padding:22px 16px 18px;border-radius:13px}
.sheet .snum{right:14px;top:14px;font-size:32px}
.sheet .sicon{font-size:18px;margin-bottom:8px}
.sheet .sname{font-size:14px;letter-spacing:-.025em}
.sheet .sdesc{font-size:11.5px;line-height:1.6;margin-top:7px;min-height:5.8em}
.sheet .schips{gap:5px;margin-top:12px}
.sheet .schips span{font-size:10.5px;padding:3px 7px;border-radius:6px}
.sheet .sgo{font-size:12px;margin-top:13px}

/* 전체 보기 — 상단 전폭 카드 */
.sheet.wide{grid-template-columns:auto 1fr auto;align-items:center;gap:20px;
  margin:0 0 16px;padding:24px 26px;border-radius:14px;
  background:linear-gradient(120deg, color-mix(in srgb, var(--accent) 7%, var(--surface)), var(--surface) 55%)}
.sheet.wide::before{height:5px}
.sheet.wide .wmark{display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:12px;
  background:var(--accent);color:#fff;font-size:20px;flex:none}
.sheet.wide .wtxt{display:block;text-align:left}
.sheet.wide .sname{font-size:17px;font-weight:700}
.sheet.wide .sdesc{min-height:0;margin-top:4px;font-size:12.5px}
.sheet.wide .wdots{display:flex;gap:5px;margin-top:10px}
.sheet.wide .wdots i{width:9px;height:9px;border-radius:50%}
.sheet.wide .sgo{margin-top:0;font-size:13px;white-space:nowrap}
.sheet.wide:hover{transform:translateY(-2px)}

@media (max-width:1000px){.sheets{grid-template-columns:repeat(3,1fr)}.sheet .sdesc{min-height:4.6em}}
@media (max-width:700px){
  .sheets{grid-template-columns:repeat(2,1fr)}
  .sheet .sdesc{min-height:0}
  .sheet.wide{grid-template-columns:auto 1fr;gap:14px;padding:20px}
  .sheet.wide .sgo{grid-column:2;margin-top:10px}
}

/* 전체 보기 카드를 5열 그리드 전체에 맞춤 */
.sheets{margin-top:22px}
.sheet.wide{grid-column:1 / -1;margin:0 0 4px}
@media (max-width:1000px){.sheet.wide{grid-column:1 / -1}}

/* ================= 메인 화면 v4 : 배너 + 칩 + 카드 ================= */
html,body{overflow-x:hidden}

/* --- 히어로 배너 --- */
.banner{position:relative;width:100vw;margin-left:calc(50% - 50vw);
  background:linear-gradient(180deg,#EFEEEB,#E6E5E1);padding:0;overflow:hidden}
html[data-theme="dark"] .banner{background:linear-gradient(180deg,#20262E,#1C222A)}
.banner-in{max-width:1080px;margin:0 auto;padding:52px 34px 58px;display:grid;
  grid-template-columns:minmax(240px,.78fr) 1.22fr;gap:26px;align-items:center;min-height:390px}
.btext .beyebrow{font-size:13px;color:var(--dim);margin-bottom:14px;font-weight:400}
.btext h1{font-size:clamp(30px,4.4vw,48px);font-weight:700;letter-spacing:-.045em;line-height:1.14;
  margin:0;color:var(--head)}
.btext h1 em{font-style:normal;font-weight:400;display:block;font-size:.62em;letter-spacing:-.03em;
  color:var(--num);margin-bottom:6px}
.btext .bsub{font-size:14px;color:var(--dim);margin:16px 0 0;font-weight:300;max-width:34ch;line-height:1.7}
.btext .bdate{font-family:var(--mono);font-size:14px;color:var(--num);margin-top:38px;letter-spacing:.02em}
.bstage{display:flex;align-items:center;justify-content:center}
.hero-svg{width:100%;max-width:620px;height:auto;color:var(--head);
  --pg-ow:var(--surface);--pg-gy:var(--surface2)}
html[data-theme="dark"] .hero-svg{--pg-ow:#2A313B;--pg-gy:#333A44}
.hero-svg g,.hero-svg path,.hero-svg rect,.hero-svg circle,.hero-svg ellipse,.hero-svg line{transition:opacity .35s}
.bdots{display:flex;gap:7px;justify-content:center;padding:0 0 20px}
.bdots button{width:8px;height:8px;border-radius:50%;border:0;background:var(--num);opacity:.28;padding:0;transition:.18s}
.bdots button[aria-current="true"]{opacity:1;background:var(--accent);width:22px;border-radius:99px}

/* --- 칩 내비 --- */
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:26px 0 4px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chiprow button{--c:var(--slate);display:flex;align-items:center;gap:8px;white-space:nowrap;
  background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 16px 8px 8px;
  font-family:var(--sans);font-size:13px;font-weight:500;color:var(--fg);transition:.15s}
.chiprow button i{width:26px;height:26px;border-radius:50%;background:var(--c);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-style:normal}
.chiprow button:hover{border-color:var(--c);transform:translateY(-1px)}
.chiprow button.solid{background:var(--slate);color:#fff;border-color:var(--slate);padding-left:16px}
.chiprow button.solid i{display:none}

/* --- 프로모 카드 --- */
.promos{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-top:26px}
.promo{--accent:var(--slate);background:none;border:0;padding:0;text-align:left;font-family:var(--sans);cursor:pointer}
.promo .tile{position:relative;aspect-ratio:1/.92;border-radius:10px;overflow:hidden;
  background:color-mix(in srgb, var(--accent) 15%, var(--surface));
  display:flex;align-items:center;justify-content:center;transition:.2s}
.promo .tile .glyph{font-size:38px;line-height:1;filter:saturate(.9)}
.promo .tile .pct{position:absolute;right:9px;bottom:9px;min-width:34px;height:34px;border-radius:50%;
  background:var(--accent);color:#fff;font-family:var(--mono);font-size:11px;font-weight:600;
  display:flex;align-items:center;justify-content:center;padding:0 6px}
.promo:hover .tile{transform:translateY(-3px);box-shadow:0 12px 26px rgba(74,85,104,.16)}
.promo .ptitle{display:block;font-size:13.5px;font-weight:700;color:var(--head);margin-top:12px;letter-spacing:-.02em}
.promo .psub{display:block;font-size:12px;color:var(--dim);font-weight:300;margin-top:4px;line-height:1.5}
.promo.wide{grid-column:1 / -1;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:20px;
  background:linear-gradient(120deg, color-mix(in srgb, var(--slate) 8%, var(--surface)), var(--surface) 60%);
  border:1px solid var(--line);border-radius:12px;padding:20px 24px}
.promo.wide .wmark{width:46px;height:46px;border-radius:11px;background:var(--slate);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:20px}
.promo.wide .ptitle{margin-top:0;font-size:16px}
.promo.wide .psub{margin-top:3px}
.promo.wide .wdots{display:flex;gap:5px;margin-top:9px}
.promo.wide .wdots i{width:9px;height:9px;border-radius:50%}
.promo.wide .pgo{font-size:13px;font-weight:600;color:var(--num);white-space:nowrap}

 "0:5":["0:8"],"0:6":["0:9"],"0:7":["0:10"],"0:8":["0:11"],"0:9":["0:12"],
 "1:0":["1:0","1:1","1:2","1:3","1:4"],"1:1":["1:5"],"1:2":["1:6"],"1:3":["1:7"],
 "2:0":["2:0","2:1"],"2:1":["2:2"]};
function migrateGearEdits(ed){
  const out={};
  for(const key in ed){
    const map=GEAR_MIG[key];
    if(!map){out[key]=ed[key];continue}
    if(map.length===1){out[map[0]]=ed[key]}
    else if(ed[key]&&ed[key].__deleted){map.forEach(nk=>out[nk]={__deleted:true})}
  }
  return out;
}
function kindList(){
  const seen=new Set();const out=[];
  const push=(k)=>{const key=String(k).replace(/\s/g,"");if(k&&!seen.has(key)){seen.add(key);out.push(k)}};
  GEAR.forEach((g,gi)=>g.items.forEach((it,ii)=>{
    const ed=USER.gearEdits[gi+":"+ii];
    if(ed&&ed.__deleted) return;
    push((ed||it).k);
  }));
  USER.gearKinds.forEach(x=>push(x.k));
  USER.gear.forEach(u=>push(u.k));
  return out;
}
function gearNamesBy(sub){
  const key=String(sub).replace(/\s/g,"");
  const {cards,order,orphans}=gearCardData();
  const out=[];
  const add=n=>{n=String(n).trim();if(n&&!out.includes(n))out.push(n)};
  order.forEach(ck=>{const c=cards[ck];
    if(String(c.k).replace(/\s/g,"").includes(key))
      c.prods.forEach(p=>String(p.n).split("·").forEach(add));
  });
  orphans.forEach(u=>{if(String(u.k).replace(/\s/g,"").includes(key))String(u.n).split("·").forEach(add)});
  return out;
}

function scatter(rows,cfg){
  const W=760,H=320,P={l:56,r:24,t:16,b:46};
  if(!rows.length) return `<p class="nodata">표시할 데이터가 없다.</p>`;
  const xs=rows.map(cfg.x),ys=rows.map(cfg.y);
  let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const padx=(x1-x0||cfg.dx)*.28+cfg.dx*.1, pady=(y1-y0||cfg.dy)*.28+cfg.dy*.1;
  x0-=padx;x1+=padx;y0=Math.max(0,y0-pady);y1+=pady;
  const px=v=>P.l+(v-x0)/(x1-x0)*(W-P.l-P.r);
  const py=v=>H-P.b-(v-y0)/(y1-y0)*(H-P.t-P.b);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${cfg.aria}">`;
  for(let i=0;i<=4;i++){
    const yv=y0+(y1-y0)*i/4, xv=x0+(x1-x0)*i/4;
    s+=`<line class="grid-l" x1="${P.l}" y1="${py(yv).toFixed(1)}" x2="${W-P.r}" y2="${py(yv).toFixed(1)}"/>`;
    s+=`<text class="axis-t" x="${P.l-10}" y="${(py(yv)+3.5).toFixed(1)}" text-anchor="end">${cfg.fy(yv)}</text>`;
    s+=`<line class="grid-l" x1="${px(xv).toFixed(1)}" y1="${P.t}" x2="${px(xv).toFixed(1)}" y2="${H-P.b}"/>`;
    s+=`<text class="axis-t" x="${px(xv).toFixed(1)}" y="${H-P.b+17}" text-anchor="middle">${cfg.fx(xv)}</text>`;
  }
  s+=`<line class="axis-l" x1="${P.l}" y1="${H-P.b}" x2="${W-P.r}" y2="${H-P.b}"/>`;
  s+=`<line class="axis-l" x1="${P.l}" y1="${P.t}" x2="${P.l}" y2="${H-P.b}"/>`;
  s+=`<text class="axis-title" x="${W-P.r}" y="${H-6}" text-anchor="end">${cfg.xl}</text>`;
  s+=`<text class="axis-title" x="${P.l-10}" y="${P.t-4}" text-anchor="end">${cfg.yl}</text>`;
  rows.forEach(r=>{
    const cx=px(cfg.x(r)),cy=py(cfg.y(r)),rad=5+(Number(r.rating)||3)*1.7;
    if(r.channel) s+=`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${(rad+6).toFixed(1)}" fill="none" class="flag-ring"/>`;
    s+= cfg.hollow
      ? `<circle class="dot" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${rad.toFixed(1)}" fill="none" stroke="var(--accent)" stroke-width="2.4"><title>${esc(r.bean)} · ${r.date} · ★${r.rating}</title></circle>`
      : `<circle class="dot" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${rad.toFixed(1)}" fill="var(--accent)" fill-opacity=".85"><title>${esc(r.bean)} · ${r.date} · ★${r.rating}</title></circle>`;
    const flip=cx>W-190;
    s+=`<text class="dot-lab" x="${(cx+(flip?-rad-9:rad+9)).toFixed(1)}" y="${(cy+3.5).toFixed(1)}" text-anchor="${flip?"end":"start"}">${esc(String(r.bean).slice(0,16))}</text>`;
  });
  return s+`</svg>`;
}

  CUP_ITEMS.forEach((_,i)=>{const[x,y]=pt(i,1);s+=`<line class="grid-l" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`});
  const norm=v=>Math.max(0,(num(v)-6)/4);
  s+=`<polygon points="${CUP_ITEMS.map(([k],i)=>pt(i,norm(c[k])).map(v=>v.toFixed(1)).join(",")).join(" ")}"
        fill="var(--accent)" fill-opacity=".22" stroke="var(--accent)" stroke-width="1.8"/>`;
  CUP_ITEMS.forEach(([k],i)=>{const[x,y]=pt(i,norm(c[k]));s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.8" fill="var(--accent)"/>`});

function gearCardData(){
  const cards={};const order=[];
  const mkCard=(grp,k)=>{const ck=grp+"||"+String(k).replace(/\s/g,"");
    if(!cards[ck]){cards[ck]={ck,grp,k,prods:[],ms:[],ki:null};order.push(ck)}
    return cards[ck];};
  GEAR.forEach((g,gi)=>{
    g.items.forEach((it,ii)=>{
      const ed=USER.gearEdits[gi+":"+ii];
      if(ed&&ed.__deleted) return;
      const item=ed||it;
      const c=mkCard(g.grp,item.k);
      c.prods.push({id:"s:"+gi+":"+ii,n:item.n,key:gi+":"+ii,seed:true,edited:!!ed});
      if(item.m)c.ms.push(item.m);
    });
  });
  order.forEach(ck=>{const c=cards[ck];
    const mm=USER.kindMeta[String(c.k).replace(/\s/g,"")];
    if(mm&&mm.m&&!c.ms.includes(mm.m))c.ms.push(mm.m);});
  USER.gearKinds.forEach((x,ki)=>{
    const c=mkCard(x.grp||"공통",x.k);
    if(c.ki==null)c.ki=ki;
    if(x.m&&!c.ms.includes(x.m))c.ms.push(x.m);
  });
  const orphans=[];
  USER.gear.forEach((u,ui)=>{
    const key=String(u.k).replace(/\s/g,"");
    let hit=null;
    for(const ck of order){if(String(cards[ck].k).replace(/\s/g,"")===key){hit=cards[ck];break}}
    if(hit){hit.prods.push({id:"u:"+ui,n:u.n,ui,seed:false})}
    else orphans.push({...u,__ui:ui});
  });
  /* 저장된 순서 적용: 알려진 id 우선, 새 항목은 뒤에 원래 순서로 */
  order.forEach(ck=>{
    const saved=USER.gearOrder[ck];
    if(!saved) return;
    const c=cards[ck];
    c.prods.sort((a,b)=>{
      const ia=saved.indexOf(a.id),ib=saved.indexOf(b.id);
      return (ia<0?saved.length:ia)-(ib<0?saved.length:ib);
    });
  });
  return {cards,order,orphans};
}
async function saveGearOrder(ck,ids,rerender){
  USER.gearOrder[ck]=ids;
  await persist();
  if(rerender) renderEverything();
}

  if(pressTimer){clearTimeout(pressTimer);pressTimer=null}
  const ul=li.parentElement;
  dragCtx={li,ul,ck:li.dataset.ck};
  li.classList.add("drag-active");
  document.body.classList.add("drag-lock");
  try{li.setPointerCapture&&li.setPointerCapture(e.pointerId)}catch(_){}
  if(navigator.vibrate){try{navigator.vibrate(12)}catch(_){}}
}
function endGearDrag(save){
  if(pressTimer){clearTimeout(pressTimer);pressTimer=null}
  pressStart=null;
  if(!dragCtx) return;
  const {ul,li,ck}=dragCtx;
  li.classList.remove("drag-active");
  document.body.classList.remove("drag-lock");
  dragCtx=null;
  if(save){
    const ids=[...ul.querySelectorAll("li[data-pid]")].map(x=>x.dataset.pid);
    saveGearOrder(ck,ids,false); /* 화면은 그대로 두고 조용히 저장 → 바로 다음 줄을 이어서 옮길 수 있다 */
  }else{
    renderEverything();
  }
}
if(typeof document!=="undefined"&&document.addEventListener){
  document.addEventListener("pointerdown",e=>{
    const li=e.target.closest&&e.target.closest(".g-prod li[data-pid]");
    if(!li) return;
    if(e.target.closest("button")) return;
    if(e.target.closest(".grip")){e.preventDefault();beginGearDrag(li,e);return}
    pressStart={x:e.clientX,y:e.clientY};
    pressTimer=setTimeout(()=>{beginGearDrag(li,e)},420);
  });
  document.addEventListener("pointermove",e=>{
    if(pressTimer&&pressStart&&(Math.abs(e.clientX-pressStart.x)>8||Math.abs(e.clientY-pressStart.y)>8)){
      clearTimeout(pressTimer);pressTimer=null;pressStart=null;
    }
    if(!dragCtx) return;
    e.preventDefault();
    const y=e.clientY;
    const sibs=[...dragCtx.ul.querySelectorAll("li[data-pid]")].filter(x=>x!==dragCtx.li);
    let before=null;
    for(const s of sibs){const r=s.getBoundingClientRect();if(y<r.top+r.height/2){before=s;break}}
    if(before) dragCtx.ul.insertBefore(dragCtx.li,before);
    else dragCtx.ul.appendChild(dragCtx.li);
  },{passive:false});
  document.addEventListener("pointerup",()=>{if(dragCtx)endGearDrag(true);else if(pressTimer){clearTimeout(pressTimer);pressTimer=null;pressStart=null}});
  document.addEventListener("pointercancel",()=>{endGearDrag(false)});
}

      ${u.m?`<div class="g-m">${esc(u.m)}</div>`:""}</div>`).join("")}

}

function unitOf(key){return key==="gear"?"개":key==="beans"?"종":"건"}
function chipsOf(key){
  if(key==="beans"){
    const B=beansAll();
    return [`원두 ${B.length}종`,`로스터리 ${new Set(B.map(b=>b.roaster)).size}곳`];
  }
  if(key==="cupping"){const C=all("cupping");return [`기록 ${C.length}건`,"SCA 8항목"];}
  if(key==="espresso"){const E=all("espresso");return [`샷 ${E.length}건`,`채널링 ${E.filter(r=>r.channel).length}건`];}
  if(key==="filter"){const F=all("filter");return [`드립 ${F.length}건`,`드리퍼 ${new Set(F.map(r=>r.dripper)).size}종`];}
  return [`장비 ${countOf("gear")}개`,`구분 ${GEAR.length+(USER.gear.length?1:0)}개`];
}

const V=id=>{const el=document.getElementById(id);return el?el.value.trim():""};
const N=id=>{const v=V(id);return v===""?null:Number(v)};
function sec(v){
  v=String(v).trim();if(!v)return 0;
  if(v.includes(":")){const[m,s]=v.split(":");return Number(m)*60+Number(s)}
  const n=Number(v);if(!isFinite(n))return 0;
  return n>=100?Math.floor(n/100)*60+(n%100):n;
}
async function saveRecord(){
  const err=document.getElementById("err");err.textContent="";
  let rec;
  if(formType==="gear"){
    if(!V("f_gn")){err.textContent="장비명을 입력해줘";return}
    rec={k:V("f_gk")||"기타",n:V("f_gn")}; /* m 미포함 — 병합 시 기존 비고 보존 */
  }else if(formType==="gearkind"){
    if(!V("f_kk")){err.textContent="구분명을 입력해줘";return}
    rec={grp:V("f_kg")||"공통",k:V("f_kk"),m:V("f_km")};
  }else if(formType==="beans"){
    if(!V("f_name")){err.textContent="원두명을 입력해줘";return}
    rec={name:V("f_name"),roaster:V("f_roaster")||"—",origin:V("f_origin")||"—",process:V("f_process")||"—",
         variety:V("f_variety")||"—",roast:V("f_roast"),buy:V("f_buy"),open:V("f_open"),
         shop:V("f_shop")||"—",note:V("f_note")};
  }else{
    if(!V("f_date")||!beanVal()){err.textContent="날짜와 원두는 필수야";return}
    const base={date:V("f_date"),bean:beanVal(),roaster:V("f_roaster")||"—",roast:V("f_roast")};
    if(formType==="espresso"){
      if(!N("f_dose")||!N("f_yield")||!N("f_time")){err.textContent="도징 · 추출량 · 추출시간은 필수야";return}
      rec={...base,grind:V("f_grind")||"—",dose:N("f_dose"),yield:N("f_yield"),pi:N("f_pi")??0,
           piBar:N("f_pibar")??0,bar:N("f_bar")??0,basket:V("f_basket")||"—",time:N("f_time"),
           temp:N("f_temp")??0,channel:!!V("f_channel"),acid:N("f_acid"),sweet:N("f_sweet"),
           body:N("f_body"),rating:N("f_rating")??3,memo:V("f_memo")};
    }else if(formType==="filter"){
      if(!N("f_dose")||!N("f_water")){err.textContent="도징과 물량은 필수야";return}
      rec={...base,dripper:V("f_dripper"),grind:V("f_grind")||"—",dose:N("f_dose"),water:N("f_water"),
           temp:N("f_temp")??0,bloom:N("f_bloom")??0,pour:sec(V("f_pour")),total:sec(V("f_total")),
           acid:N("f_acid"),sweet:N("f_sweet"),body:N("f_body"),rating:N("f_rating")??3,memo:V("f_memo")};
    }else{
      rec={...base,notes:V("f_notes"),uni:N("f_uni")??0,clean:N("f_clean")??0,
           sweetn:N("f_sweetn")??0,defect:N("f_defect")??0};
      CUP_ITEMS.forEach(([k])=>rec[k]=N("f_"+k)??6);
    }
  }
  const dest=formType;
  if(editRef){
    const merged={...editRef.orig,...rec};
    delete merged.__seed;delete merged.__user;delete merged.__edited;delete merged.__gk;delete merged.__ui;delete merged.mine;delete merged.__ki;
    if(dest==="gearkind"){
      if(editRef.scope==="meta") USER.kindMeta[editRef.idx]={m:V("f_km")};
      else{
        const old=USER.gearKinds[editRef.idx]||{};
        const on=String(old.k||"").replace(/\s/g,""), nn=String(merged.k||"").replace(/\s/g,"");
        if(on&&(on!==nn||old.grp!==merged.grp)){
          USER.gear.forEach(u=>{if(String(u.k).replace(/\s/g,"")===on)u.k=merged.k});
          const oldCk=(old.grp||"공통")+"||"+on, newCk=(merged.grp||"공통")+"||"+nn;
          if(USER.gearOrder[oldCk]){USER.gearOrder[newCk]=USER.gearOrder[oldCk];delete USER.gearOrder[oldCk]}
        }
        USER.gearKinds[editRef.idx]=merged;
      }
    }else if(dest==="gear"){
      if(editRef.scope==="seed") USER.gearEdits[editRef.idx]=merged;
      else USER.gear[editRef.idx]=merged;
    }else if(editRef.scope==="seed"){
      USER.edits[dest][editRef.idx]=merged;
    }else{
      USER[dest][editRef.idx]=merged;
    }
  }else{
    if(dest==="gearkind") USER.gearKinds.push(rec);
    else USER[dest].push(rec);
  }
  editRef=null;
  const ok=await persist();
  closeModal();renderHome();
  toast(ok?"기록을 저장했다":"화면에는 반영했지만 저장에 실패했다");
  openSheets({beans:"p-bean",cupping:"p-cup",espresso:"p-esp",filter:"p-fil",gear:"p-gear",gearkind:"p-gear"}[dest]);
}

async function deleteRecord(){
  if(!editRef) return;
  if(!confirm("이 기록을 삭제한다. 되돌릴 수 없다.")) return;
  const {type,scope,idx}=editRef;
  if(type==="gearkind"){
    if(scope==="meta") delete USER.kindMeta[idx];
    else USER.gearKinds.splice(idx,1);
  }else if(type==="gear"){
    if(scope==="seed") USER.gearEdits[idx]={__deleted:true};
    else USER.gear.splice(idx,1);
  }else if(scope==="seed"){
    USER.edits[type][idx]={__deleted:true};
  }else{
    USER[type].splice(idx,1);
    if(type==="gear"){
      for(const ck in USER.gearOrder){
        USER.gearOrder[ck]=USER.gearOrder[ck]
          .filter(id=>id!=="u:"+idx)
          .map(id=>{if(id.startsWith("u:")){const n=+id.slice(2);return n>idx?"u:"+(n-1):id}return id});
      }
    }
  }
  editRef=null;
  const ok=await persist();
  closeModal();renderEverything();
  toast(ok?"기록을 삭제했다":"화면에는 반영했지만 저장에 실패했다");
}

function csvCell(v){v=v==null?"":String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function csvRows(rows){return rows.map(r=>r.map(csvCell).join(",")).join("\n")}
function exportCSV(){
  const E=all("espresso"),F=all("filter"),C=all("cupping"),B=beansAll();
  const gearFlat=[];
  const tmp=GEAR.map((g,gi)=>g.items.map((it,ii)=>{
    const ed=USER.gearEdits[gi+":"+ii];
    return ed&&ed.__deleted?null:{grp:g.grp,...(ed||it)};
  })).flat().filter(Boolean);
  tmp.forEach(x=>gearFlat.push(x));
  USER.gear.forEach(u=>gearFlat.push({grp:"추가 장비",...u}));

  let out="\uFEFF[원두 정보]\n";
  out+=csvRows([["원두명","로스터리","원산지/농장","가공방식","품종","로스팅레벨","구매일","개봉일","구매처","특징/컵노트"],
    ...B.map(b=>[b.name,b.roaster,b.origin,b.process,b.variety,b.roast,b.buy,b.open,b.shop,b.note])]);
  out+="\n\n[커핑 시트]\n";
  out+=csvRows([["날짜","원두명","로스터리","로스팅레벨",...CUP_ITEMS.map(c=>c[1]),"균일성","클린컵","스위트니스","결점(감점)","총점","테이스팅 노트"],
    ...C.map(c=>[c.date,c.bean,c.roaster,c.roast,...CUP_ITEMS.map(([k])=>c[k]),c.uni,c.clean,c.sweetn,c.defect,total(c).toFixed(2),c.notes])]);
  out+="\n\n[에스프레소 기록]\n";
  out+=csvRows([["날짜","원두명","로스터리","로스팅레벨","그라인더 세팅","도징량(g)","추출량(g)","비율","프리인퓨전(초)","프리인퓨전압력(bar)","본압(bar)","바스켓","추출시간(초)","물온도(°C)","채널링여부","신맛","단맛","바디감","별점(1-5)","메모/이슈"],
    ...E.map(r=>[r.date,r.bean,r.roaster,r.roast,r.grind,r.dose,r.yield,(num(r.yield)/num(r.dose)).toFixed(2),r.pi,r.piBar,r.bar,r.basket,r.time,r.temp,r.channel?"Y":"N",r.acid,r.sweet,r.body,r.rating,r.memo])]);
  out+="\n\n[필터 기록]\n";
  out+=csvRows([["날짜","원두명","로스터리","로스팅레벨","드리퍼","그라인더 세팅","도징량(g)","물량(g)","비율","물온도(°C)","뜸시간(초)","푸어링시간","총추출시간","신맛","단맛","바디감","별점(1-5)","메모/이슈"],
    ...F.map(r=>[r.date,r.bean,r.roaster,r.roast,r.dripper,r.grind,r.dose,r.water,(num(r.water)/num(r.dose)).toFixed(1),r.temp,r.bloom,mmss(r.pour),mmss(r.total),r.acid,r.sweet,r.body,r.rating,r.memo])]);
  out+="\n\n[장비 정보]\n";
  out+=csvRows([["구분","장비명","비고"],...gearFlat.map(g=>[g.grp+" · "+g.k,g.n,g.m])]);

  const fname="커피_추출_기록_"+new Date().toISOString().slice(0,10)+".csv";
  let downloaded=false;
  try{
    const blob=new Blob([out],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=fname;
    a.style.display="none";
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800);
    downloaded=true;
  }catch(e){downloaded=false}
  /* 브라우저/샌드박스가 다운로드를 막아도 데이터는 가져갈 수 있게 복사 패널을 항상 연다 */
  openCsvBox(out,fname,downloaded);
}

  const t=document.getElementById("syncin").value.trim();
  if(!t){err.textContent="다른 기기에서 복사한 코드를 붙여넣어줘";return}
  if(!t.startsWith("BA1:")){err.textContent="코드 형식이 아니야 (BA1: 으로 시작해야 함)";return}
  let p;
  try{p=normalizeUser(JSON.parse(decodeURIComponent(escape(atob(t.slice(4))))))}
  catch(e){err.textContent="코드를 읽을 수 없어 — 전체가 빠짐없이 복사됐는지 확인해줘";return}
  if(mode==="replace"){
    if(!confirm("이 기기의 기록을 붙여넣은 코드의 기록으로 완전히 교체한다. 계속할까?"))return;
    USER=p;
  }else{
    for(const k of ["espresso","filter","cupping","beans","gear","gearKinds"]){
      p[k].forEach(r=>{
        const s=JSON.stringify(r);
        if(!USER[k].some(x=>JSON.stringify(x)===s)) USER[k].push(r);
      });
    }
    for(const k in USER.edits) for(const i in p.edits[k]) if(!USER.edits[k][i]) USER.edits[k][i]=p.edits[k][i];
    for(const i in p.gearEdits) if(!USER.gearEdits[i]) USER.gearEdits[i]=p.gearEdits[i];
    for(const i in p.kindMeta) if(!USER.kindMeta[i]) USER.kindMeta[i]=p.kindMeta[i];
    for(const i in p.gearOrder) if(!USER.gearOrder[i]) USER.gearOrder[i]=p.gearOrder[i];
  }
  const ok=await persist();
  closeSync();renderEverything();
  let msg=ok?(mode==="replace"?"기록을 교체했다":"기록을 합쳤다"):"화면에는 반영했지만 저장에 실패했다";
  if(p._v&&typeof APP_VERSION!=="undefined"&&p._v!==APP_VERSION)
    msg+=" · ⚠ 코드를 만든 기기("+p._v+")와 이 기기("+APP_VERSION+")의 버전이 달라 — 두 기기 모두 최신 파일인지 확인해줘";
  else if(!p._v&&typeof APP_VERSION!=="undefined")
    msg+=" · ⚠ 구버전 기기에서 만든 코드라 일부 항목이 빠졌을 수 있어";
  toast(msg);
}

/* ============ 배경음악 ============ */
const BGM_SRC="bgm.mp3";
let bgm=null, bgmOn=false, bgmArmed=false;
function bgmInit(){
  bgm=new Audio(BGM_SRC);
  bgm.loop=true;
  bgm.volume=0.35;
  bgm.addEventListener("error",()=>{
    const b=document.getElementById("bgmbtn");
    if(b){b.style.display="none"}
  });
  let pref=null;
  try{pref=localStorage.getItem("coffeelab:bgm")}catch(e){}
  if(pref==="on"){
    bgmOn=true; updateBgmBtn();
    bgm.play().catch(()=>{ /* 자동재생 차단 → 첫 터치에서 시작 */
      bgmArmed=true;
      const kick=()=>{if(bgmArmed&&bgmOn){bgm.play().catch(()=>{});bgmArmed=false}
        document.removeEventListener("pointerdown",kick)};
      document.addEventListener("pointerdown",kick);
    });
  }
}
function toggleBgm(){
  if(!bgm) bgmInit();
  bgmOn=!bgmOn;
  if(bgmOn) bgm.play().catch(()=>{});
  else bgm.pause();
  try{localStorage.setItem("coffeelab:bgm",bgmOn?"on":"off")}catch(e){}
  updateBgmBtn();
  toast(bgmOn?"배경음악을 켰다":"배경음악을 껐다");
}
function updateBgmBtn(){
  const b=document.getElementById("bgmbtn");
  if(b) b.textContent=bgmOn?"🎵 음악 끔":"🎵 음악";
}
bgmInit();
